name: Testes Python
on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
permissions:
  contents: read
jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependências
        run: python -m pip install -e '.[dev]'
      - name: Compilar
        run: python -m compileall -q src tests
      - name: Testes
        run: python -m pytest -q
